# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: sandbox-launchpad
infra:
  provider: bicep
  path: infra
services:
  web:
    project: .
    language: docker
    host: containerapp
    docker:
      path: Dockerfile
      context: .
      platform: linux/amd64
      remoteBuild: true
hooks:
  preprovision:
    shell: sh
    run: python3 scripts/prepare.py
    interactive: false
