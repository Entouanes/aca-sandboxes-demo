[project]
name = "sandbox-launchpad"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "azure-containerapps-sandbox==0.1.0b4",
  "azure-identity>=1.19,<2",
  "fastapi>=0.115,<0.120",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<9", "httpx>=0.28,<1", "ruff>=0.11,<1", "anyio>=4.8,<4.13"]
browser = ["playwright>=1.50,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
